[pytest]
testpaths = tests
python_files = test_*.py
; Makes repo-root imports (import core.io_universal, import xas.qt_xas, ...)
; resolve regardless of how pytest is invoked. Without this, bare `pytest`
; (the README's own documented command, and what CI runs) fails with
; ModuleNotFoundError on every top-level package -- only `python -m pytest`
; happens to work unaided, since -m adds the CWD to sys.path itself.
pythonpath = .
; One unified suite. The historical -p no:pytest-qt + per-file ignore
; workaround (pytest-qt's plugin auto-imported PySide6 on every session,
; which corrupted Tk's Tcl interpreter for any tk.Tk() built later in the
; same process on Windows) became unnecessary when the last Tk-based test
; file was retired along with the legacy Tk app.
