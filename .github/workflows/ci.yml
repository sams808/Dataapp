name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6 needs libEGL/libGL/libxkbcommon etc. even for the
      # "offscreen" platform plugin -- not present on a bare ubuntu-latest
      # runner, and the ImportError this causes aborts pytest collection
      # entirely (an INTERNALERROR, not a normal test failure).
      - name: Install Qt runtime libraries
        uses: tlambert03/setup-qt-libs@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-qt.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-xas.txt
          pip install ruff

      - name: Lint (ruff, F + E9)
        run: ruff check --select F,E9 --exclude EXAMPLES --exclude .git .

      - name: Run tests (offscreen Qt platform)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
